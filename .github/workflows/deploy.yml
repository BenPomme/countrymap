name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # Optional monetization config. Set as repo Variables (preferred) or
        # Secrets in Settings > Secrets and variables > Actions. Empty = feature off.
        env:
          NEXT_PUBLIC_AMAZON_ASSOCIATE_TAG: ${{ vars.NEXT_PUBLIC_AMAZON_ASSOCIATE_TAG || secrets.NEXT_PUBLIC_AMAZON_ASSOCIATE_TAG }}
          NEXT_PUBLIC_AMAZON_DOMAIN: ${{ vars.NEXT_PUBLIC_AMAZON_DOMAIN || secrets.NEXT_PUBLIC_AMAZON_DOMAIN }}
          NEXT_PUBLIC_LIEN_CIE_STORE_URL: ${{ vars.NEXT_PUBLIC_LIEN_CIE_STORE_URL || 'https://lienetcie.com' }}
          NEXT_PUBLIC_TRUTHLE_STORE_CODE: ${{ vars.NEXT_PUBLIC_TRUTHLE_STORE_CODE || 'TRUTHLE10' }}
          NEXT_PUBLIC_BOOKING_AID: ${{ vars.NEXT_PUBLIC_BOOKING_AID || secrets.NEXT_PUBLIC_BOOKING_AID }}
          NEXT_PUBLIC_VPN_AFFILIATE_URL: ${{ vars.NEXT_PUBLIC_VPN_AFFILIATE_URL || secrets.NEXT_PUBLIC_VPN_AFFILIATE_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
